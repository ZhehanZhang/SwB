services:
  - type: web
    name: swb
    runtime: docker
    plan: starter
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    disk:
      name: switchboard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SWITCHBOARD_DATA
        value: /data
      - key: SWITCHBOARD_PUBLIC_URL
        sync: false
      - key: SWITCHBOARD_KEY_OWNER
        generateValue: true
