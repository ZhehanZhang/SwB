# Copy to config/capy-bridge.yaml (git-ignored). No secrets here: those live in .env.

# Public origin of this server. The MCP endpoint is <public_url>/mcp and the OAuth issuer is public_url.
public_url: https://bridge.example.com

auth:
  # Who may sign in through Cloudflare Access (checked only when cloudflare_access is set).
  owner_emails: [owner@example.com]
  # Optional: verify the Cf-Access-Jwt-Assertion header on /authorize.
  # cloudflare_access:
  #   team_domain: your-team.cloudflareaccess.com
  #   aud: <Access application AUD tag>
  # true: the owner password is always required, even behind Access.
  require_password: true
  # Allowed OAuth redirect URIs (exact, or prefix with /*; loopback matches any port).
  # redirect_uris: [https://claude.ai/api/mcp/auth_callback, https://claude.com/api/mcp/auth_callback,
  #   https://chatgpt.com/connector_platform_oauth_redirect, "https://chatgpt.com/connector/oauth/*",
  #   "http://localhost/*", "http://127.0.0.1/*"]
  # Hosts allowed to serve Client ID Metadata Documents.
  # cimd_hosts: [claude.ai, claude.com, anthropic.com, chatgpt.com, openai.com]
  # Optional: map a redirect host / client name fragment to a source tag.
  # source_names: {cursor: cursor}

capy:
  api_base: https://api.capy.ai/api/v1
  # The Captain thread tasks go to by default (Captain ZINF-1).
  captain_id: jam_EXAMPLECAPTAIN

delegate:
  # captain, or a project alias below.
  default_target: captain
  # How a task reaches the Captain while it is busy: queue, steer or interrupt.
  captain_delivery: queue
  daily_cap: 20
  timezone: America/New_York
  max_file_bytes: 10485760
  # Projects capy_delegate may start threads in. repos: what a task may name.
  projects:
    infra:
      id: project_EXAMPLE
      repos: [example-org/links, example-org/site, example-org/id-site, example-org/status-service, example-org/bridge]

memory:
  # Optional markdown mirror (written on every change). Not wired until the owner approves a mount.
  # mirror_dir: /mirror
