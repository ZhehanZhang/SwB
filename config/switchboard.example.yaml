# Copy to config/switchboard.yaml (git-ignored). No secrets here: those live in .env.
# Version 2: everything in or out is a block under blocks:, the core (auth, projects, scoped memory, routes, inbox,
# audit) knows only blocks. Files without version: 2 are read as version 1 (origins:, destinations:, slack:);
# switchboard config migrate prints them as version 2.
version: 2

# Public origin of this server. The MCP endpoint is <public_url>/mcp and the OAuth issuer is public_url.
public_url: https://swb.example.com
timezone: America/New_York
# One conversation (a send plus the replies hanging off it) pauses after this many turns, and the owner gets a DM.
# A new send starts at zero. null switches it off.
turn_cap: 200

auth:
  # Who may sign in through Cloudflare Access (checked only when cloudflare_access is set).
  owner_emails: [owner@example.com]
  # Verify the Cf-Access-Jwt-Assertion header on / (admin) and /authorize. Access app "Switchboard" covers the whole host
  # with SSO; "Switchboard machine paths (bypass)" lets /mcp, /token, /register, /revoke, /.well-known, /healthz,
  # /inbox, /avatars and /connect through. There is no password sign-in: without this block, OAuth sign-in and the admin page are off.
  cloudflare_access:
    team_domain: your-team.cloudflareaccess.com
    aud: <AUD tag of the "Switchboard" Access application>
  # Allowed OAuth redirect URIs (exact, or prefix with /*; loopback matches any port). Default: every agent's from the
  # agents registry (presets plus block agents, e.g. Capy's from the capy block) and loopback. Setting it replaces that.
  # redirect_uris: [https://claude.ai/api/mcp/auth_callback, https://claude.com/api/mcp/auth_callback,
  #   https://chatgpt.com/connector_platform_oauth_redirect, "https://chatgpt.com/connector/oauth/*",
  #   "http://localhost/*", "http://127.0.0.1/*"]
  # Optional: map a redirect host / client name fragment to an agent name.
  # source_names: {cursor: cursor}
  # Optional: limit bearer keys (by name, the part after SWITCHBOARD_KEY_) to memory scopes. Unlisted keys see every scope.
  # key_scopes: {acme-agent: [project:acme]}
  # inbox_keys: {channel: claude-code}         # inbox-only keys (/inbox/poll, /inbox/events) bound to one agent; this is the default

# Optional. Who calls in. Without this section every preset (claude, chatgpt, gemini, claude-code) is known, plus the
# agents blocks bring (capy). Agents connected with a pairing code register themselves.
# agents:
#   claude: {}
#   codex: {label: Codex}

blocks:
  github:
    use: github
    enabled: false
    secret_env: GITHUB_WEBHOOK_SECRET
    sinks:
      team: {url_env: TEAM_GITHUB_SINK_URL}
    routes:
      "acme/app": [team]
      "acme/*": [team]

  mcp:
    use: mcp
    legacy_aliases: true                        # list the deprecated capy_* and agent_send names (this release only)
    # wait limits in seconds. claude.ai and Claude Desktop cut a tool call at 240 s.
    # Claude Code fails an HTTP request with no response byte after max(60 s, MCP_TOOL_TIMEOUT, MCP_TIMEOUT),
    # so keep claude-code under 60 s unless you raised MCP_TOOL_TIMEOUT there.
    wait:
      default_s: 60
      max_s: 200
      agents:
        claude-code: {default_s: 45, max_s: 55}

  # Discord (optional): bot mentions, thread replies, DMs and the discord_* tools.
  discord:
    use: discord
    enabled: false
    # token_env: DISCORD_BOT_TOKEN             # environment override; otherwise save at the discord_provision link
    # application_id: "100000000000000000"   # optional; learned from the Gateway if omitted
    # threads: true                           # start a public thread when replying in a server text channel
    # personas: false                         # use one webhook per parent channel for persona posts
    # message_content: true                   # enable Message Content Intent under Bot in the Discord Developer Portal
    # ack_reaction: "👀"                        # null disables acknowledgements
    # dm_space: home                          # use this space's trust and routing in DMs; defaults to the first space
    # connect: true                           # false skips the Gateway connection, for REST-only tests
    # daily_cap: null                         # optional limit on outbound tool calls per day
    # agents: {claude: [home]}                 # agent to space labels or "*"; controls posts and event inboxes
    # target_aliases: {}                      # block-local target slugs
    # refresh_minutes: 30                     # how often to refresh targets
    # spaces:
    #   home:
    #     guild_id: "100000000000000001"      # required Discord server ID
    #     owner_ids: ["100000000000000002"]   # the owner's Discord user IDs
    #     known: {"100000000000000003": Friend}
    #     listen: ["100000000000000004"]      # channel or thread IDs
    #     default_target: helper
    #     project: example
    #     channel_projects: {"#builds": example}
    #     bot_posts_per_hour: 20

  capy:
    use: capy
    api_base: https://api.capy.ai/api/v1
    # Runaway guard: the same task to the same target within duplicate_window_s returns the existing handle (loops are
    # caught by turn_cap at the top level). daily_cap is an optional hard limit, off (null) by default.
    duplicate_window_s: 600
    daily_cap: null
    # Who sends. service (default): an agent's own CAPY_API_KEY_AS_<AGENT> if present, else the service user's key
    # named by send_key_env; never CAPY_API_KEY. personal: the same, then CAPY_API_KEY, so one key is enough.
    # CAPY_API_KEY always does the reads and stream following.
    identity: service
    send_key_env: CAPY_API_KEY_SERVICE
    max_file_bytes: 10485760
    # How a task reaches a busy Captain or thread: queue, steer or interrupt.
    captain_delivery: queue
    # Stop following a delegation after this many days (MCP task TTL too).
    handle_ttl_days: 7
    # true: Captain personas use their Capy avatar in Slack (an undocumented capy.ai asset path); off by default.
    avatars: false

  # Telegram (optional): long polling in, Bot API posts out. Set enabled: true to start setup.
  telegram:
    use: telegram                               # which block to load
    enabled: false                              # disabled until you opt in
    # token_env: TELEGRAM_BOT_TOKEN              # or enter the token at a telegram_provision claim link
    # dm_space: home                            # where private chats go; default is the first space
    # ack_reaction: "👀"                         # reaction on addressed messages; null disables it
    # persona_prefix: true                      # include the persona on a bold first line
    # refresh_minutes: 30                       # how often to look up targets
    # target_aliases: {}                         # extra routing slugs, e.g. {helper: claude}
    # agents: {claude: [home]}                   # space list per agent, or "*" for all spaces
    # spaces:                                   # maps labels to one or more sets of groups
    #   home:                                   # label used in telegram_post and visibility
    #     chats: [-100111222]                   # negative integer group ids, each in at most one space
    #     owner_ids: [222222]                   # Telegram user ids trusted as owner
    #     known: {333333: Friend}               # known Telegram user ids and display names
    #     default_target: claude                # target when no slug or earlier thread target exists
    #     listen: [-100111222]                  # file unaddressed messages from these chats; needs privacy mode off
    #     project: example                      # default switchboard project
    #     channel_projects: {-100111222: null}  # override or opt out of the project by chat id
    #     bot_posts_per_hour: 20                # limit in each conversation thread

  # Slack (optional): events in (watched channels, mentions, DMs, @swb <slug> routing) and slack_* tools out.
  # Tokens never go here: every *_env names a variable in .env. Config changes apply on restart.
  slack:
    use: slack
    refresh_minutes: 30                         # how often targets ("@swb <slug>") are re-read
    workspace_projects: {}                      # e.g. {a2a: acme}: the switchboard project a workspace's events belong to
    channel_projects: {}
    listen_channels: {}
    # Needed only for persona avatars stored under <data>/avatars, which Slack fetches from <public_base_url>/avatars/<file>
    # (keep /avatars outside Access).
    public_base_url: https://switchboard.example.com
    max_text_chars: 4000
    event_retention_days: 14
    # Display name + avatar for bot posts (chat:write.customize). Never applies to user-token posts. A persona with no
    # icon_url uses <id>.png (or avatar:) from <data>/avatars, avatar_dirs, or the bundled monograms; emoji is the fallback.
    personas:
      switchboard: {name: Switchboard, emoji: ":robot_face:"}
      claude: {name: Claude}
      chatgpt: {name: ChatGPT}
      gemini: {name: Gemini}
      codex: {name: Codex}
      claude-code: {name: Claude Code}
      capy: {name: Capy}
      helper: {name: Helper, avatar: helper.png}
    avatar_dirs: []                               # extra folders searched for avatar files (e.g. a branding overlay)
    target_aliases: {}                            # extra "@bot <slug>" names, e.g. {pp: teamcaptain}
    workspaces:
      # Workspace A: an agent room. The bot is @mentionable and can also act as the owner (with approval).
      a2a:
        team_id: T0AAAAAAA
        app_id: A0AAAAAAA                         # this Slack app; its own posts are never delivered back
        app_token_env: SLACK_A2A_APP_TOKEN        # xapp-..., connections:write (Socket Mode)
        intake: socket                            # or poll (conversations.history every poll_seconds)
        identities:
          bot: {token_env: SLACK_A2A_BOT_TOKEN, write: free}        # xoxb-...
          user: {token_env: SLACK_A2A_USER_TOKEN, write: approval}  # xoxp-..., the owner's own account
        default_persona: switchboard
        default_target: captain                   # "@bot text" with no slug goes here (a Captain, agent or project slug)
        approver_user_id: U0OWNER00               # optional: approval DMs for this workspace's requests come from its bot
        owner_user_ids: [U0OWNER00]               # trust owner: passed on unchanged (defaults to the approver)
        known: {U0FRIEND0: Alex, B0OTHERBOT: main-agent}   # trust known: Slack user or bot ids you trust, with names
        sender_rate: {count: 5, window_s: 600}    # context items per non-owner sender before the rest are dropped
        ack_reaction: eyes                        # added to @mentions and DMs on receipt
        watched: ["#agents"]                      # the bot must be a member (invite it yourself); "*" = every channel it is in
        bot_thread_posts_per_hour: 20             # loop guard: more bot posts in one thread per hour need approval
        sinks:                                    # optional: also POST each event to a webhook
          - {name: a2a-hook, url_env: SLACK_SINK_A2A_URL, secret_env: SLACK_SINK_A2A_SECRET, kinds: [watched, mention, dm], coalesce_seconds: 0, targets: [captain]}
      # Workspace B: private. User token only: no bot, no personas, never joins or invites.
      private:
        team_id: T0CCCCCCC
        user_only: true
        app_token_env: SLACK_PRIVATE_APP_TOKEN
        identities:
          user: {token_env: SLACK_PRIVATE_USER_TOKEN, write: approval}  # user_only allows only approval or never
        watched: ["#family"]
    # Owner approvals: a DM with Approve / Reject buttons from a workspace's bot, plus the root page. Agents never approve.
    approvals:
      ttl_minutes: 60
      notify_workspace: a2a
      approver_user_id: U0OWNER00
    # What each switchboard agent (OAuth agent or SWITCHBOARD_KEY_<NAME>) may do in Slack. Unlisted agents get nothing.
    # Each agent posts as the persona named like it (claude -> claude) unless persona / persona_by_workspace says otherwise.
    agents:
      capy: {allow_persona_override: true, workspaces: {a2a: [bot]}}
      claude: {allow_persona_override: true, allowed_personas: [claude, helper], workspaces: {a2a: [bot, user], private: [user]}}
      chatgpt: {workspaces: {a2a: [bot]}}

# Optional. Slug priority on a clash ("capy:captain", "agent", "project"); default: block targets, agents, projects.
# targets:
#   priority: [capy:captain, agent, project]
#   aliases: {pp: capy:captain:<Captain id>}

# Seeds, written once when that agent/project slot has no route yet. The global default is empty unless set here.
# routes:
#   - {match: {}, to: "capy:captain:<Captain id>"}

# Who can reach what. Every resource is private (the owner and his own signed-in agents only) unless marked shared.
# Resources: target:<slug>, channel:<workspace>/<id or #name>, memory:<general | project:slug>, route:<id>, tool:<name>.
# shared means anyone in that workspace; a list narrows it to Slack user ids and workspace:<label>. Tools stay private.
# Anyone else's message to something private becomes a context item in its inbox, with a neutral "Noted." reply.
# The root page and visibility_set flip a resource; those overrides win over this file.
visibility:
  defaults: {target: private, channel: private, memory: private, route: private}
  resources:
    target:teamcaptain: shared
    channel:a2a/#agents: shared
    # target:helper: [U0FRIEND0, workspace:a2a]

memory:
  # Optional one-way markdown mirror: general/, projects/<slug>/ and INDEX.md, rewritten atomically after changes.
  # Bursts of writes collapse into one export after mirror_debounce_s of quiet. mirror: false switches it off.
  # mirror_dir: /mirror
  # mirror: true
  # mirror_debounce_s: 2
