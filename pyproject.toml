[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capy-bridge"
version = "0.1.0"
description = "Self-hosted remote MCP server: shared memory for every assistant, and offloading work to Capy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.30",
  "starlette>=1.0",
  "python-multipart>=0.0.20",
  "PyJWT[crypto]>=2.9,<3",
  "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
capy-bridge = "capy_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capy_bridge = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
