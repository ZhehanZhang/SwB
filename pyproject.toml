[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swb-one"
version = "1.0.0"
description = "First-party agents working together."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "web/licenses/lobe-icons.txt"]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "agents", "self-hosted", "shared-memory", "routing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp>=2.3,<3",
  "slack_sdk>=3.48,<4",
  "aiohttp>=3.10,<4",
  "httpx>=0.28,<1",
  "httpx2>=2.10.0",
  "PyYAML>=6,<7",
  "pillow>=10.1",
  "uvicorn>=0.30",
  "starlette>=1.0",
  "python-multipart>=0.0.20",
  "PyJWT[crypto]>=2.9,<3",
  "webauthn>=2.2,<3",
  "tzdata",
]

[project.optional-dependencies]
companion = ["bless>=0.2.6,<1"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://swb.one"
Documentation = "https://swb.one"
Source = "https://github.com/ZhehanZhang/SwB"
Issues = "https://github.com/ZhehanZhang/SwB/issues"

[project.scripts]
swb = "switchboard.entrypoint:cli_main"
switchboard = "switchboard.entrypoint:cli_main"
swb-one = "switchboard.entrypoint:cli_main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
switchboard = ["brand.json", "static/**/*", "prompts/setup/*.md", "slack/avatars/*", "marks/*.svg", "marks/*.css"]

[tool.ruff.lint]
select = ["F", "E9", "E401", "E711", "E722"]

[tool.ruff.lint.per-file-ignores]
"src/switchboard/auth.py" = ["F401"]
"src/switchboard/blocks/capy/__init__.py" = ["F401", "F841"]
"tests/slack/test_*.py" = ["F401", "F811"]
"tests/test_correlation.py" = ["F401"]
"tests/test_routes.py" = ["F541"]
"tests/test_safety.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
