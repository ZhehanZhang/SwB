[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.2.0"
description = "Self-hosted switchboard: MCP origins, a core with scoped shared memory and routes, and Capy as a destination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "slack_sdk>=3.48,<4",
  "aiohttp>=3.10,<4",
  "httpx>=0.28,<1",
  "httpx2>=2.10.0",
  "PyYAML>=6,<7",
  "pillow>=10.1",
  "uvicorn>=0.30",
  "starlette>=1.0",
  "python-multipart>=0.0.20",
  "PyJWT[crypto]>=2.9,<3",
  "webauthn>=2.2,<3",
  "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
switchboard = "switchboard.__main__:main"
swb = "switchboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
switchboard = ["static/*", "static/app/**/*", "prompts/*.txt", "slack/avatars/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
