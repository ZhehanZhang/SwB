# switchboard: docker compose up -d --build
# Secrets: .env (mode 600, git-ignored), see .env.example. YAML under ./config is optional.
# MCP: http://127.0.0.1:8870/mcp by default. Public exposure: --profile tunnel with
# TUNNEL_TOKEN in .env; the tunnel's public hostname points at http://switchboard:8000.
# Memory mirror: bind a host folder at /mirror in compose.override.yaml (git-ignored) and set memory.mirror_dir;
# Set SWITCHBOARD_UID to the non-root UID that owns those directories, or grant UID 10001 write access.
name: switchboard
services:
  switchboard:
    build:
      context: .
      target: runtime
      args:
        APP_UID: ${SWITCHBOARD_UID:-10001}
    image: switchboard:local
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      SWITCHBOARD_HOST: 0.0.0.0
      SWITCHBOARD_PORT: ""
      SWB_COMPOSE_ORIGIN: "http://${SWITCHBOARD_BIND:-127.0.0.1}:${SWITCHBOARD_PORT:-8870}"
      SWITCHBOARD_TRUSTED_PROXIES: ${SWITCHBOARD_TRUSTED_PROXIES:-}
    ports:
      - "${SWITCHBOARD_BIND:-127.0.0.1}:${SWITCHBOARD_PORT:-8870}:8000"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.6
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - switchboard
    restart: unless-stopped
