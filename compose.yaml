# capy-bridge: docker compose up -d --build
# Secrets: .env (mode 600, git-ignored), see .env.example. Config: config/capy-bridge.yaml.
# MCP: http://127.0.0.1:8870/mcp by default. Public exposure: --profile tunnel with
# TUNNEL_TOKEN in .env; the tunnel's public hostname points at http://capy-bridge:8000.
name: capy-bridge
services:
  capy-bridge:
    build:
      context: .
      target: runtime
    image: capy-bridge:local
    env_file:
      - path: .env
        required: false
    ports:
      - "${CAPY_BRIDGE_BIND:-127.0.0.1}:${CAPY_BRIDGE_PORT:-8870}:8000"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.6
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - capy-bridge
    restart: unless-stopped
