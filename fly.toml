app = "your-switchboard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SWITCHBOARD_DATA = "/data"
  SWITCHBOARD_PUBLIC_URL = "https://your-switchboard.fly.dev"

[mounts]
  source = "switchboard_data"
  destination = "/data"
  initial_size = 1

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
