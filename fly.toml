primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "paas"

[env]
  PORT = "8000"
  SWB_DATA_DIR = "/data"
  SWB_DEPLOY_PLATFORM = "fly"

# SwB runs as one Machine on one volume. Deploy with fly deploy --ha=false.
[mounts]
  source = "switchboard_data"
  destination = "/data"
  initial_size = 1

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
