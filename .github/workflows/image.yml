name: Container image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'release' || github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare image version and build date
        id: build
        shell: bash
        env:
          IMAGE: ${{ github.repository_owner }}/swb
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            probe=$(curl --silent --show-error --max-time 20 --write-out '\n%{http_code}' \
              --get --data-urlencode "scope=repository:${IMAGE,,}:pull" --data-urlencode 'service=ghcr.io' https://ghcr.io/token)
            if [[ "${probe##*$'\n'}" != "403" ]] || ! jq -e '.errors | any(.code == "DENIED")' <<<"${probe%$'\n'*}" >/dev/null; then
              echo "Manual builds require a private GHCR package." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the package version: v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/swb
          labels: org.opencontainers.image.title=SwB
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=${{ steps.build.outputs.version }}-rc.1,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
