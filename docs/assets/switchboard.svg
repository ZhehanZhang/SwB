<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t2 d2">
  <title id="t2">How SwB connects</title>
  <desc id="d2">Agents on the left and chat platforms and webhooks on the right plug into the SwB core, which keeps projects, routes, conversations and the audit log.</desc>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#fafafa" stroke="#e4e4e7"/>
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="60" y="64" font-size="13" font-weight="600" letter-spacing="1.2" fill="#71717a">WHERE YOUR AGENTS ALREADY RUN</text>
    <text x="1140" y="64" font-size="13" font-weight="600" letter-spacing="1.2" fill="#71717a" text-anchor="end">WHERE PEOPLE AND EVENTS ARE</text>
    <g><rect x="60" y="86" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="80" y="116" font-size="17" font-weight="500" fill="#18181b">Claude Projects</text><circle cx="310" cy="110" r="9" fill="#3f3f46"/><circle cx="310" cy="110" r="4" fill="#09090b"/></g>
    <g><rect x="60" y="162" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="80" y="192" font-size="17" font-weight="500" fill="#18181b">ChatGPT and dots</text><circle cx="310" cy="186" r="9" fill="#3f3f46"/><circle cx="310" cy="186" r="4" fill="#09090b"/></g>
    <g><rect x="60" y="238" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="80" y="268" font-size="17" font-weight="500" fill="#18181b">Grok</text><circle cx="310" cy="262" r="9" fill="#3f3f46"/><circle cx="310" cy="262" r="4" fill="#09090b"/></g>
    <g><rect x="60" y="314" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="80" y="344" font-size="17" font-weight="500" fill="#18181b">Capy Captains</text><circle cx="310" cy="338" r="9" fill="#3f3f46"/><circle cx="310" cy="338" r="4" fill="#09090b"/></g>
    <g><rect x="60" y="390" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="80" y="420" font-size="17" font-weight="500" fill="#18181b">Coding agents</text><circle cx="310" cy="414" r="9" fill="#3f3f46"/><circle cx="310" cy="414" r="4" fill="#09090b"/></g>
    <g><rect x="890" y="86" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="1120" y="116" font-size="17" font-weight="500" fill="#18181b" text-anchor="end">Slack</text><circle cx="890" cy="110" r="9" fill="#3f3f46"/><circle cx="890" cy="110" r="4" fill="#09090b"/></g>
    <g><rect x="890" y="162" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="1120" y="192" font-size="17" font-weight="500" fill="#18181b" text-anchor="end">Discord</text><circle cx="890" cy="186" r="9" fill="#3f3f46"/><circle cx="890" cy="186" r="4" fill="#09090b"/></g>
    <g><rect x="890" y="238" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="1120" y="268" font-size="17" font-weight="500" fill="#18181b" text-anchor="end">Telegram</text><circle cx="890" cy="262" r="9" fill="#3f3f46"/><circle cx="890" cy="262" r="4" fill="#09090b"/></g>
    <g><rect x="890" y="314" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="1120" y="344" font-size="17" font-weight="500" fill="#18181b" text-anchor="end">GitHub webhooks</text><circle cx="890" cy="338" r="9" fill="#3f3f46"/><circle cx="890" cy="338" r="4" fill="#09090b"/></g>
    <g><rect x="890" y="390" width="250" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7"/><text x="1120" y="420" font-size="17" font-weight="500" fill="#18181b" text-anchor="end">Claude and Grok routines</text><circle cx="890" cy="414" r="9" fill="#3f3f46"/><circle cx="890" cy="414" r="4" fill="#09090b"/></g>
    <rect x="450" y="96" width="300" height="320" rx="14" fill="#18181b"/>
    <text x="600" y="148" font-family="Inter Tight, Inter, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1.5" fill="#fafafa" text-anchor="middle">SwB</text>
