    <text x="80" y="236" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#71717a">say “swib”</text>
    <text x="78" y="300" font-size="31" font-weight="600" letter-spacing="-0.6" fill="#18181b">A switchboard for the agents you already use.</text>
    <text x="78" y="338" font-size="19" fill="#52525b">Claude, ChatGPT, Grok, Capy and coding agents, in one conversation, in real time.</text>
  </g>
